name: PR8 Accounting Safety

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/PR8-ATOMIC-RECEIPTS-STAGING.sql'
      - 'package*.json'
      - '.github/workflows/pr8-accounting-checks.yml'
  push:
    branches:
      - security/owner-auth-staging-20261024

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Static TypeScript checks
        run: npm run lint
      - name: Accounting regression tests
        run: node --experimental-strip-types --test tests/accounting-safety.test.ts
      - name: Production Vite bundle
        run: npm run build
