name: PR8 Accounting Safety

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/PR8-ATOMIC-RECEIPTS-STAGING.sql'
      - 'docs/PR8-ACCOUNTING-IDENTITY-STAGING.sql'
      - 'package*.json'
      - '.github/workflows/pr8-accounting-checks.yml'
  push:
    branches:
      - security/owner-auth-staging-20261024

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Static TypeScript checks
        run: npm run lint
      - name: Accounting regression tests
        run: node --experimental-strip-types --test tests/accounting-safety.test.ts
      - name: Atomic SQL receipt and reversal regressions (isolated Postgres)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f tests/sql/accounting-fixture.sql
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f docs/PR8-ATOMIC-RECEIPTS-STAGING.sql
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f docs/PR8-ACCOUNTING-IDENTITY-STAGING.sql
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f tests/sql/accounting-atomic.test.sql
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f tests/sql/accounting-create-order.test.sql
      - name: Reject double collection across two simultaneous browser sessions
        env:
          PGPASSWORD: postgres
        run: |
          set +e
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -v payment_id=88888888-8888-4888-8888-888888888888 -f tests/sql/accounting-concurrent-collect.sql > /tmp/concurrent1.log 2>&1 &
          p1=$!
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -v payment_id=99999999-9999-4999-8999-999999999999 -f tests/sql/accounting-concurrent-collect.sql > /tmp/concurrent2.log 2>&1 &
          p2=$!
          wait "$p1"; s1=$?
          wait "$p2"; s2=$?
          set -e
          cat /tmp/concurrent1.log /tmp/concurrent2.log
          if [ "$s1" -eq 0 ] && [ "$s2" -ne 0 ]; then
            echo "First receipt committed; second safely refused"
          elif [ "$s2" -eq 0 ] && [ "$s1" -ne 0 ]; then
            echo "Second receipt committed; first safely refused"
          else
            echo "Expected exactly one of two concurrent 5M receipts to commit"
            exit 1
          fi
          psql -h 127.0.0.1 -U postgres -d accounting_test -v ON_ERROR_STOP=1 -f tests/sql/accounting-concurrent-verify.sql

      - name: Production Vite bundle
        run: npm run build
