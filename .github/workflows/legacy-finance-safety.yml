name: Legacy finance safety

on:
  push:
    branches:
      - fix/legacy-accounting-safety-20261024
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/legacy-finance-safety.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
