name: Customer overpayment safety
on:
  push:
    branches:
      - fix/customer-overpayment-credit-20261024
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/CUSTOMER_OVERPAYMENT_CREDIT.sql'
      - '.github/workflows/customer-credit-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer_credit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --experimental-strip-types --test tests/legacy-finance-outbox.test.ts
      - name: Real PostgreSQL FIFO overpayment + credit tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d customer_credit_test -v ON_ERROR_STOP=1 -f tests/sql/legacy-fifo-verify.sql
