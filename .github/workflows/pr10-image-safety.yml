name: PR10 image safety checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/pr10-image-safety.yml'
  push:
    branches:
      - 'integration/stability-staging-20261024'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run lint
      - name: Order image safety unit tests (mocked uploads)
        run: npx tsx --test tests/order-image-safety.test.ts
      - name: Offline pending order and receipt durability tests
        run: npx tsx --test tests/stability-outbox.test.ts
      - name: Verify cloud image readback never confirms wrong photos
        run: npx tsx --test tests/order-image-readback.test.ts
      - name: Verify uploaded Storage object metadata and error handling
        run: npx tsx --test tests/verify-uploaded-image.test.ts
      - name: Vite production build
        run: npm run build
